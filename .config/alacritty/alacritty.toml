general.import = [ "~/.local/state/omarchy/current/theme/alacritty.toml" ]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "MesloLGLDZ Nerd Font Mono" }
bold = { family = "MesloLGLDZ Nerd Font Mono" }
italic = { family = "MesloLGLDZ Nerd Font Mono" }
size = 11

[window]
padding.x = 14
padding.y = 14
decorations = "None"

[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" },
  { key = "Return", mods = "Shift", chars = "\u001B[13;2u" }
]

[terminal.shell]
program = "/usr/bin/bash"

[terminal]
osc52 = "CopyPaste"
