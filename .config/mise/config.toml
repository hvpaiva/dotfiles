# Tools wanted on every machine. Host-specific ones go in conf.d/local.toml (a per-host
# file, hosts/<host>), which mise loads after this file, so a pin there overrides a value here.
[tools]
ripgrep = "latest"
fd = "latest"
eza = "latest"
bat = "latest"
"aqua:bats-core/bats-core" = "latest"
argocd = "3.5.3"
ast-grep = "latest"
aws-cli = { version = "2.37.9", symlink_bins = "true" }
bun = "latest"
cargo-deny = "latest"
cargo-insta = "latest"
cliamp = "latest"
crossplane = "2.5.0"
delta = "0.20.1"
difftastic = "0.71.0"
direnv = "2.37.1"
"gem:rubocop" = "latest"
"gem:standard" = "latest"
"gem:try-cli" = "latest"
glow = "latest"
git-filter-repo = "latest"
"github:docker/docker-language-server" = "latest"
go = "latest"
"go:github.com/joshmedeski/sesh/v2" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
helm-ls = "latest"
herdr = "latest"
hugo = "0.167.0"
hyperfine = "latest"
just = "1.58.0"
kubecolor = "latest"
kyverno = "1.19.1"
lua-language-server = "latest"
marksman = "latest"
"npm:bash-language-server" = "latest"
"npm:gh-actions-language-server" = { version = "latest", allow_low_downloads = "true" }
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
"pipx:hermes-agent" = { version = "latest", extras = "all" }
"pipx:jrnl" = "latest"
pnpm = "12.9.1"
prettier = "latest"
rtk = "latest"
ruby = "latest"
shfmt = "latest"
stylua = "latest"
tmux = "3.7c"
tree-sitter = "latest"
uv = "latest"
vale = "3.24.0"
yq = "4.54.1"
zellij = "0.45.1"
zoxide = "latest"
"npm:wrangler" = "latest"
"gem:slipway" = "latest"
"cargo:bacon" = "latest"
"cargo:cargo-aoc" = "latest"
"cargo:tardis-cli" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-vet" = "latest"
"pipx:graphifyy" = "latest"
# mise's cargo backend installs through cargo-binstall when it is present: the
# release binary when a crate publishes one, a source build otherwise
cargo-binstall = "latest"
cocogitto = "latest"
"cargo:bootimage" = "latest"
"cargo:cargo-audit" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-outdated" = "latest"
"cargo:cargo-sbom" = "latest"
"cargo:cargo-semver-checks" = "latest"
"cargo:flamegraph" = "latest"
"cargo:presenterm" = "latest"
"cargo:rustlings" = "latest"
"cargo:trlt" = "latest"
"pipx:browser-use" = "latest"
"github:asciinema/agg" = { version = "latest", bin = "agg" }
"github:BurntSushi/biff" = "latest" # renamed bttf upstream from 0.1.4: the binary is bttf
"github:webstonehq/tuxedo" = "latest"
"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"pipx:debugpy" = "latest"
"github:microsoft/vscode-js-debug" = { version = "latest", asset_pattern = "js-debug-dap-*.tar.gz" }
"github:vadimcn/codelldb" = { version = "latest", asset_pattern = "codelldb-{{ os() }}-{{ arch() }}.vsix", bin_path = "extension/adapter" }
"gem:rich-ri" = "0.1.1"
shellcheck = "latest"
"github:rogalmic/vscode-bash-debug" = { version = "untagged-438733f35feb8659d939", asset_pattern = "bash-debug-*.vsix" }
"npm:basedpyright" = "latest"
ruff = "latest"
taplo = "latest"
terraform = "latest"
terraform-ls = "latest"
tflint = "latest"
golangci-lint = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["ruby"]

[settings.github]
# gh keeps its token in the keyring, which gh_cli_tokens (it reads hosts.yml) cannot see.
credential_command = "gh auth token"

[settings.ruby]
compile = false
# Gems every Ruby mise installs gets right away. ruby-lsp is one: its C
# extensions are built for one Ruby ABI, so it lives inside each Ruby instead
# of being a mise tool (the editor runs the project's Ruby's own).
default_packages_file = "~/.config/mise/default-gems"

[settings.upgrade]
