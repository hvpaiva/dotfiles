# Tools wanted on every machine. Host-specific ones go in conf.d/local.toml (a per-host
# file, hosts/<host>), which mise loads after this file, so a pin there overrides a value here.
[tools]
ripgrep = "latest"
fd = "latest"
eza = "latest"
bat = "latest"
"aqua:bats-core/bats-core" = "latest"
"aqua:modem-dev/hunk" = "latest"
argocd = "3.5.2"
ast-grep = "latest"
aws-cli = { version = "2.36.43", symlink_bins = "true" }
bun = "latest"
cargo-deny = "latest"
cargo-insta = "latest"
claude = "latest"
cliamp = "latest"
codex = "latest"
copilot = "latest"
crossplane = "2.5.0"
crush = "latest"
cursor-agent = { version = "latest", bin_path = "dist-package", strip_components = "0", url = 'https://downloads.cursor.com/lab/{{ version }}/{{ os(macos="darwin") }}/{{ arch(arm64="arm64", x64="x64") }}/agent-cli-package.tar.gz', version_list_url = "https://cursor.com/install", version_regex = 'downloads\.cursor\.com/lab/([0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]+)/', postinstall = 'mkdir -p "$MISE_TOOL_INSTALL_PATH/bin" && ln -sfn ../dist-package/cursor-agent "$MISE_TOOL_INSTALL_PATH/bin/cursor-agent"' }
delta = "0.19.2"
difftastic = "0.68.0"
direnv = "2.37.1"
"gem:rubocop" = "latest"
"gem:ruby-lsp" = "latest"
"gem:standard" = "latest"
"gem:try-cli" = "latest"
glow = "latest"
gemini = { version = "latest", allow_builds = ["@github/keytar", "node-pty"] }
gh = "latest"
git-filter-repo = "latest"
"github:can1357/oh-my-pi" = "latest"
"github:docker/docker-language-server" = "latest"
go = "latest"
"go:github.com/joshmedeski/sesh/v2" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
helm-ls = "latest"
herdr = "latest"
"http:muse" = { version = "latest", url = "https://api.meta.ai/muse-launcher.sh", bin = "muse", version_list_url = "https://api.meta.ai/muse-code/channels/muse-stable", version_json_path = ".version" }
hugo = "0.157.0"
hyperfine = "latest"
just = "1.58.0"
kubecolor = "latest"
kyverno = "1.19.1"
lua-language-server = "latest"
marksman = "latest"
node = "25.0.0"
"npm:@xai-official/grok" = "latest"
"npm:bash-language-server" = "latest"
"npm:gh-actions-language-server" = { version = "latest", allow_low_downloads = "true" }
"npm:playwright" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
opencode = "latest"
"pipx:hermes-agent" = { version = "latest", extras = "all" }
"pipx:jrnl" = "latest"
pnpm = "10.22.0"
prettier = "latest"
rtk = "latest"
ruby = "latest"
shfmt = "latest"
stylua = "latest"
tmux = "3.7c"
tree-sitter = "latest"
uv = "latest"
vale = "3.22.0"
yq = "4.53.2"
zellij = "0.44.1"
zoxide = "latest"
"npm:wrangler" = "latest"
"gem:slipway" = "latest"
"cargo:bacon" = "latest"
"cargo:cargo-aoc" = "latest"
"cargo:tardis-cli" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-vet" = "latest"
"pipx:graphifyy" = "latest"
# mise's cargo backend installs through cargo-binstall when it is present: the
# release binary when a crate publishes one, a source build otherwise
cargo-binstall = "latest"
cocogitto = "latest"
"cargo:bootimage" = "latest"
"cargo:cargo-audit" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-outdated" = "latest"
"cargo:cargo-sbom" = "latest"
"cargo:cargo-semver-checks" = "latest"
"cargo:flamegraph" = "latest"
"cargo:presenterm" = "latest"
"cargo:rustlings" = "latest"
"cargo:trlt" = "latest"
"pipx:browser-use" = "latest"
"github:asciinema/agg" = { version = "latest", bin = "agg" }
"github:BurntSushi/biff" = "latest" # renamed bttf upstream from 0.1.4: the binary is bttf
"github:webstonehq/tuxedo" = "latest"
ghcup = "latest"
"mise-ghcup:ghc" = "latest"
"mise-ghcup:hls" = "latest"
cabal = "latest"
stack = "latest"
"cargo:ghcitty" = "latest"
ormolu = "latest"
"github:tfausak/cabal-gild" = "latest"
hlint = "latest"
"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"gem:debug" = "latest"
"pipx:debugpy" = "latest"
"github:microsoft/vscode-js-debug" = { version = "latest", asset_pattern = "js-debug-dap-*.tar.gz" }
"github:vadimcn/codelldb" = { version = "latest", asset_pattern = "codelldb-{{ os() }}-{{ arch() }}.vsix", bin_path = "extension/adapter" }
"gem:rich-ri" = "0.1.0"

[plugins]
"vfox-backend:mise-ghcup" = "https://github.com/wasp-lang/mise-ghcup.git"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["ruby"]

[settings.ruby]
compile = false

[settings.upgrade]
auto_prune = false
