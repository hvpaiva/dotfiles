# Personal additions on top of Omarchy's tmux.conf.

# Copy mode: Escape leaves, C-c only clears the selection
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi C-c send -X clear-selection

# Session picker: sesh takes over prefix+s from the built-in choose-tree.
# fzf runs on the terminal palette, so it follows the Omarchy theme.
bind -N "Switch session (sesh)" s run-shell "sesh connect \"$(
    sesh list --icons | fzf-tmux -p 80%,70% \
        --prompt='❯ ' --marker='*' --pointer='◆' --separator='─' --scrollbar='' --info='right' \
        --border=rounded --border-label=' sesh ' \
        --no-sort --ansi \
        --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
        --bind 'tab:down,btab:up' \
        --bind 'ctrl-a:change-prompt(❯  )+reload(sesh list --icons)' \
        --bind 'ctrl-t:change-prompt(  )+reload(sesh list -t --icons)' \
        --bind 'ctrl-g:change-prompt(  )+reload(sesh list -c --icons)' \
        --bind 'ctrl-x:change-prompt(  )+reload(sesh list -z --icons)' \
        --bind 'ctrl-f:change-prompt(  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
        --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(❯  )+reload(sesh list --icons)' \
        --preview-window 'right:55%' \
        --preview 'sesh preview {}'
)\""

# Plugins (tpm), under XDG data. Omarchy's status line already shows PREFIX/COPY/ZOOM,
# so no mode-indicator plugin.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins"
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "joshmedeski/sesh"
set -g @plugin "sainnhe/tmux-fzf"
set -g @plugin "NHDaly/tmux-better-mouse-mode"
set -g @plugin "alexwforsythe/tmux-which-key"
set -g @plugin "tmux-plugins/tmux-open"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"    # keep last: it hooks the others

set -g @yank_with_mouse on
set -g @resurrect-dir "~/.local/share/tmux/resurrect"
set -g @resurrect-save 'S'
set -g @resurrect-restore 'C-r'

run "~/.local/share/tmux/plugins/tpm/tpm"
