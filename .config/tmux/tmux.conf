# Omarchy's tmux config, read straight from the package so upstream changes arrive
# without copying anything. Personal additions live in extras.conf, per-host ones in
# local.conf (not tracked). Omarchy's own reload binding (prefix+q) re-reads this file.
source-file /usr/share/omarchy/config/tmux/tmux.conf
source-file ~/.config/tmux/extras.conf
source-file -q ~/.config/tmux/local.conf
