# Lints every shell file, runs the unit tests, then runs the README one-liner in a clean Arch and a clean Ubuntu
# container (test/container.sh). Pushes and pull requests run the quick variant; the weekly
# run and a manual dispatch with "full" also install rustup, augur and every mise tool.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: also install rustup, augur and every mise tool
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint and syntax
        run: bash .config/dotfiles/test/check.sh lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bats
        run: sudo apt-get install -y -qq bats >/dev/null
      - name: unit tests
        run: bash .config/dotfiles/test/check.sh unit

  container:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, ubuntu]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: bootstrap twice, then dots save and dots update
        env:
          DOTFILES_SRC: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ github.token }}
        run: .config/dotfiles/test/container.sh ${{ matrix.distro }} ${{ (github.event_name == 'schedule' || inputs.full) && '--full' || '' }}
